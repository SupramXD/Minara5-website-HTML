name: Deploy to Firebase Hosting

# Auto-deploys the storefront whenever the repo is updated (e.g. when the
# admin Site Texts / Product editor syncs changes to GitHub via syncToGithub).
# This is what makes admin edits appear live without a manual `firebase deploy`.
on:
  push:
    branches: [main]

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 18

      - name: Install Firebase CLI
        run: npm install -g firebase-tools

      # Firebase Hosting only auto-created the default site for projects created before
      # 15 Oct 2026 (after that date a new project's site is provisioned on demand, so a
      # first `firebase deploy` on a new project can fail with "404 Site Not Found"). Project
      # minara5 is an existing project whose default site `minara5` is already live
      # (`firebase hosting:sites:list --project minara5`), so this step is a no-op today. It
      # exists so the pipeline keeps working if the repo is ever pointed at a new project.
      # It never changes the failure surface: without a usable FIREBASE_TOKEN it warns and
      # steps aside, leaving the token error to the deploy step (as before this change).
      - name: Ensure the Firebase Hosting site exists
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN is not set - skipping the Hosting site check."
            exit 0
          fi

          SITE_ID=minara5
          PROJECT_ID=minara5

          set +e
          list_out=$(firebase hosting:sites:list --project "$PROJECT_ID" --token "$FIREBASE_TOKEN" --non-interactive 2>&1)
          list_status=$?
          set -e
          printf '%s\n' "$list_out"

          if [ "$list_status" -ne 0 ]; then
            echo "::warning::Could not list Hosting sites (exit ${list_status}) - skipping the site check so the deploy step below reports the real error."
          elif printf '%s\n' "$list_out" | grep -E "(^|[^[:alnum:]._-])${SITE_ID}([^[:alnum:]._-]|\$)" > /dev/null; then
            echo "Hosting site '${SITE_ID}' already exists in ${PROJECT_ID} - nothing to create."
          else
            echo "Hosting site '${SITE_ID}' not found in ${PROJECT_ID} - creating it before deploying..."
            set +e
            create_out=$(firebase hosting:sites:create "$SITE_ID" --project "$PROJECT_ID" \
              --token "$FIREBASE_TOKEN" --non-interactive 2>&1)
            create_status=$?
            set -e
            printf '%s\n' "$create_out"
            if [ "$create_status" -ne 0 ]; then
              # "already exists" (HTTP 409) means the site was provisioned elsewhere
              # (console / another pipeline), which is exactly what we wanted: continue.
              if printf '%s' "$create_out" | grep -qiE "already exists|ALREADY_EXISTS|409"; then
                echo "Hosting site '${SITE_ID}' already exists - continuing."
              else
                echo "Could not create Hosting site '${SITE_ID}' (exit ${create_status})." >&2
                exit "$create_status"
              fi
            fi
          fi

      - name: Deploy hosting
        run: firebase deploy --only hosting --project minara5 --token "${{ secrets.FIREBASE_TOKEN }}" --non-interactive
