name: Sync Firestore products -> products.json

# FALLBACK PUBLISH PATH (no Cloud Functions needed).
#
# The normal path is: admin panel -> Firestore -> `syncToGithub` Cloud Function -> GitHub.
# Cloud Functions v2 (Cloud Run) needs the project to have billing enabled; whenever that
# is not the case the function cannot run at all and the static products.json goes stale
# (the admin panel then reports "GitHub sync failed: internal" - see MEMORY.md).
#
# The Firestore `products` collection is world-readable, so this workflow can mirror it
# into products.json with no secrets. It runs every 30 minutes and can also be started by
# hand from the Actions tab (`Run workflow`).
#
# If the repo secret FIREBASE_TOKEN exists, the workflow also deploys Firebase Hosting
# afterwards (pushes made with the default GITHUB_TOKEN do not trigger other workflows,
# which is why this step lives here). Without it, run
# `firebase deploy --only hosting --project minara5` manually after a sync.

# NOTE (compliance copy): the 30-minute schedule was removed from this variant of the repo so
# that the Firebase console / Firestore values can never silently overwrite the reviewed,
# brand-free product data in products.json. Run it by hand from the Actions tab only after the
# Firestore `products` documents have been updated to the same neutral names.
on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: firestore-product-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Mirror Firestore products into products.json
        run: node tools/pull-firestore-to-repo.js

      - name: Commit the mirrored data
        run: |
          if [ -z "$(git status --porcelain)" ]; then
            echo "Already in sync - nothing to commit."
            exit 0
          fi
          git config user.name "studio-extrait-sync"
          git config user.email "actions@users.noreply.github.com"
          git add -A products.json images/products
          git commit -m "Sync products from Firestore (Cloud Functions fallback)"
          git push

      - name: Deploy hosting (skipped when FIREBASE_TOKEN is not configured)
        env:
          FIREBASE_TOKEN: ${{ secrets.FIREBASE_TOKEN }}
        run: |
          if [ -z "$FIREBASE_TOKEN" ]; then
            echo "FIREBASE_TOKEN is not set - skipping hosting deploy."
            echo "The data above is committed; the live site updates on the next manual deploy."
            exit 0
          fi
          npm install -g firebase-tools

          # Firebase Hosting only auto-created the default site for projects created before
          # 15 Oct 2026; for newer projects the site is provisioned on demand and a first
          # deploy can fail with "404 Site Not Found". Site `minara5` already exists, so this
          # is a no-op today (Firebase's recommended `hosting:sites:create` guard). If the
          # site cannot be listed (e.g. a stale token) it warns and steps aside so the deploy
          # below still reports the same error it did before this guard existed.
          SITE_ID=minara5

          set +e
          list_out=$(firebase hosting:sites:list --project minara5 --token "$FIREBASE_TOKEN" --non-interactive 2>&1)
          list_status=$?
          set -e
          printf '%s\n' "$list_out"

          if [ "$list_status" -ne 0 ]; then
            echo "::warning::Could not list Hosting sites (exit ${list_status}) - skipping the site check."
          elif printf '%s\n' "$list_out" | grep -E "(^|[^[:alnum:]._-])${SITE_ID}([^[:alnum:]._-]|\$)" > /dev/null; then
            echo "Hosting site '${SITE_ID}' already exists in minara5 - nothing to create."
          else
            echo "Hosting site '${SITE_ID}' not found in minara5 - creating it before deploying..."
            set +e
            create_out=$(firebase hosting:sites:create "$SITE_ID" --project minara5 \
              --token "$FIREBASE_TOKEN" --non-interactive 2>&1)
            create_status=$?
            set -e
            printf '%s\n' "$create_out"
            if [ "$create_status" -ne 0 ]; then
              if printf '%s' "$create_out" | grep -qiE "already exists|ALREADY_EXISTS|409"; then
                echo "Hosting site '${SITE_ID}' already exists - continuing."
              else
                echo "Could not create Hosting site '${SITE_ID}' (exit ${create_status})." >&2
                exit "$create_status"
              fi
            fi
          fi

          firebase deploy --only hosting --project minara5 --token "$FIREBASE_TOKEN" --non-interactive
