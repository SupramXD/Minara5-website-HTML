<!DOCTYPE html>
<html lang="en" translate="no" class="notranslate">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="google" content="notranslate">
  <title>Studio Extrait – Admin Console</title>
  <link rel="icon" type="image/svg+xml" href="Studio Extrait Icon Svg only logo.svg">
  <!-- Google Fonts Outfit and Inter -->
  <link rel="preconnect" href="https://www.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;700&family=Outfit:wght@400;700;900&display=swap" rel="stylesheet">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.1/firebase-app.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.1/firebase-auth.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.1/firebase-firestore.js">
  <link rel="modulepreload" href="https://www.gstatic.com/firebasejs/11.0.1/firebase-functions.js">
  <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.4/dist/chart.umd.min.js"></script>
  
  <style>
    /* Sleek Editorial Style Theme - Glassmorphic Dark Mode */
    :root {
      --bg-color: #0a0a0c;
      --panel-bg: rgba(18, 18, 24, 0.75);
      --border-color: rgba(255, 255, 255, 0.08);
      --text-main: #ffffff;
      --text-muted: rgba(255, 255, 255, 0.6);
      --accent: #ccff00; /* Neon Lime Accent Color */
      --accent-muted: rgba(204, 255, 0, 0.15);
      --danger: #ff3b30;
      --success: #34c759;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      -webkit-tap-highlight-color: transparent;
    }

    /* Page protection: Hidden until authorized */
    body {
      display: none;
      background: var(--bg-color);
      color: var(--text-main);
      font-family: 'Inter', sans-serif;
      overflow-x: hidden;
      line-height: 1.5;
    }

    /* PREMIUM GLOW BACKGROUNDS */
    .glow-bg {
      position: fixed;
      top: -10%;
      right: -10%;
      width: 50vw;
      height: 50vw;
      background: radial-gradient(circle, rgba(204, 255, 0, 0.05) 0%, rgba(10, 10, 12, 0) 70%);
      pointer-events: none;
      z-index: -1;
    }

    .glow-bg-2 {
      position: fixed;
      bottom: -10%;
      left: -10%;
      width: 45vw;
      height: 45vw;
      background: radial-gradient(circle, rgba(255, 255, 255, 0.02) 0%, rgba(10, 10, 12, 0) 70%);
      pointer-events: none;
      z-index: -1;
    }

    /* HEADER & NAVIGATION */
    header.admin-header {
      background: rgba(10, 10, 12, 0.85);
      backdrop-filter: blur(20px);
      -webkit-backdrop-filter: blur(20px);
      border-bottom: 1px solid var(--border-color);
      position: sticky;
      top: 0;
      z-index: 100;
      padding: 16px 40px;
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .brand-group {
      display: flex;
      align-items: center;
      gap: 15px;
    }

    .brand-group img {
      height: 24px;
      filter: invert(1);
    }

    .brand-badge {
      background: var(--accent);
      color: #000;
      font-size: 9px;
      font-weight: 900;
      letter-spacing: 1.5px;
      padding: 3px 8px;
      border-radius: 2px;
      text-transform: uppercase;
    }

    .admin-nav-links {
      display: flex;
      gap: 30px;
      list-style: none;
    }

    .admin-nav-links a {
      color: var(--text-muted);
      text-decoration: none;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      transition: all 0.2s ease;
    }

    .admin-nav-links a:hover, .admin-nav-links a.active {
      color: var(--text-main);
      text-shadow: 0 0 10px rgba(255, 255, 255, 0.2);
    }

    /* MAIN CONTAINER */
    .admin-container {
      max-width: 1400px;
      margin: 40px auto;
      padding: 0 40px;
    }

    /* DASHBOARD TITLE HERO */
    .hero-panel {
      margin-bottom: 40px;
      display: flex;
      justify-content: space-between;
      align-items: flex-end;
    }

    .hero-title h1 {
      font-family: 'Outfit', sans-serif;
      font-size: 32px;
      font-weight: 900;
      letter-spacing: -0.5px;
      text-transform: uppercase;
    }

    .hero-title p {
      color: var(--text-muted);
      font-size: 13px;
      margin-top: 5px;
      letter-spacing: 0.5px;
    }

    .live-indicator {
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid var(--border-color);
      padding: 8px 16px;
      border-radius: 4px;
      font-size: 11px;
      letter-spacing: 1px;
      font-weight: 700;
      text-transform: uppercase;
    }

    .pulse-dot {
      width: 8px;
      height: 8px;
      background-color: var(--accent);
      border-radius: 50%;
      box-shadow: 0 0 8px var(--accent);
      animation: pulse 1.8s infinite;
    }

    @keyframes pulse {
      0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(204, 255, 0, 0.7); }
      70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(204, 255, 0, 0); }
      100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(204, 255, 0, 0); }
    }

    /* STATS GRID */
    .stats-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 20px;
      margin-bottom: 40px;
    }

    .stat-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      padding: 24px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      transition: all 0.25s ease;
    }

    .stat-card:hover {
      border-color: rgba(204, 255, 0, 0.25);
      transform: translateY(-2px);
    }

    .stat-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 15px;
    }

    .stat-label {
      color: var(--text-muted);
      font-size: 11px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .stat-value {
      font-family: 'Outfit', sans-serif;
      font-size: 28px;
      font-weight: 700;
      color: var(--text-main);
    }

    .stat-change {
      font-size: 11px;
      font-weight: 700;
      margin-top: 8px;
    }

    .stat-change.up { color: var(--success); }
    .stat-change.down { color: var(--danger); }

    /* CORE SECTIONS LAYOUT */
    .dashboard-layout {
      display: grid;
      grid-template-columns: 1.8fr 1.2fr;
      gap: 30px;
      margin-bottom: 40px;
    }

    .console-panel {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(10px);
      -webkit-backdrop-filter: blur(10px);
      border-radius: 8px;
      padding: 30px;
    }

    .panel-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    .panel-title {
      font-family: 'Outfit', sans-serif;
      font-size: 16px;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      display: flex;
      align-items: center;
      gap: 10px;
    }

    .panel-title::before {
      content: '';
      display: block;
      width: 4px;
      height: 16px;
      background: var(--accent);
    }

    /* TABLES STYLE */
    .admin-table-container {
      overflow-x: auto;
      width: 100%;
    }

    table.admin-table {
      width: 100%;
      border-collapse: collapse;
      text-align: left;
      font-size: 12.5px;
    }

    table.admin-table th {
      color: var(--text-muted);
      font-weight: 700;
      letter-spacing: 0.5px;
      text-transform: uppercase;
      padding: 12px 16px;
      border-bottom: 1px solid var(--border-color);
      font-size: 10.5px;
    }

    table.admin-table td {
      padding: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.04);
      color: var(--text-main);
      vertical-align: middle;
    }

    table.admin-table tr:hover td {
      background: rgba(255, 255, 255, 0.02);
    }

    /* BADGES */
    .status-badge {
      display: inline-block;
      font-size: 9px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      padding: 4px 10px;
      border-radius: 100px;
    }

    .status-badge.shipped {
      background: rgba(52, 199, 89, 0.15);
      color: var(--success);
      border: 1px solid rgba(52, 199, 89, 0.25);
    }

    .status-badge.pending {
      background: rgba(255, 159, 10, 0.15);
      color: #ff9f0a;
      border: 1px solid rgba(255, 159, 10, 0.25);
    }

    .status-badge.admin {
      background: var(--accent-muted);
      color: var(--accent);
      border: 1px solid rgba(204, 255, 0, 0.25);
    }

    .status-badge.user {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-muted);
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    /* BUTTONS & ACTIONS */
    .btn-action {
      background: transparent;
      border: 1px solid var(--text-muted);
      color: var(--text-main);
      padding: 6px 12px;
      font-size: 10px;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      cursor: pointer;
      transition: all 0.2s ease;
      border-radius: 2px;
    }

    .btn-action:hover {
      background: var(--text-main);
      color: #000;
      border-color: var(--text-main);
    }

    .btn-action.accent-btn {
      background: var(--accent);
      color: #000;
      border-color: var(--accent);
    }

    .btn-action.accent-btn:hover {
      opacity: 0.85;
      box-shadow: 0 0 12px var(--accent-muted);
    }

    .btn-action.danger-btn {
      border-color: var(--danger);
      color: var(--danger);
    }

    .btn-action.danger-btn:hover {
      background: var(--danger);
      color: #fff;
    }

    /* FORMS */
    .form-group {
      margin-bottom: 20px;
    }

    .form-group label {
      display: block;
      color: var(--text-muted);
      font-size: 10.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      margin-bottom: 8px;
    }

    .form-input {
      width: 100%;
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      padding: 12px 16px;
      border-radius: 4px;
      color: var(--text-main);
      font-size: 13px;
      outline: none;
      transition: all 0.2s ease;
    }

    .form-input:focus {
      border-color: var(--accent);
      background: rgba(255, 255, 255, 0.05);
      box-shadow: 0 0 10px rgba(204, 255, 0, 0.05);
    }

    /* Drop Zone */
    .drop-zone {
      border: 2px dashed var(--border-color);
      border-radius: 6px;
      padding: 20px;
      text-align: center;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.3s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 8px;
      margin-top: 5px;
    }

    .drop-zone:hover, .drop-zone.drag-over {
      border-color: var(--accent);
      background: rgba(204, 255, 0, 0.04);
      box-shadow: 0 0 15px rgba(204, 255, 0, 0.1);
    }

    .drop-zone__prompt {
      font-size: 11px;
      color: var(--text-muted);
      letter-spacing: 0.5px;
      pointer-events: none;
    }

    .drop-zone__icon {
      font-size: 24px;
      opacity: 0.6;
      transition: transform 0.2s ease;
      pointer-events: none;
    }
    
    .drop-zone:hover .drop-zone__icon {
      transform: scale(1.1);
      opacity: 1;
    }

    .drop-zone__filename {
      font-size: 11px;
      color: var(--accent);
      font-family: monospace;
      margin-top: 5px;
      word-break: break-all;
    }


    /* FULL WIDTH WRAPPER */
    .full-width-panel {
      grid-column: 1 / -1;
    }

    /* FOOTER */
    footer.admin-footer {
      background: #000;
      padding: 30px;
      text-align: center;
      font-size: 9px;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
      border-top: 1px solid var(--border-color);
      margin-top: 100px;
    }

    /* EDIT MODAL GLASSMORPHISM */
    .edit-modal {
      position: fixed;
      inset: 0;
      background: rgba(0, 0, 0, 0.7);
      backdrop-filter: blur(8px);
      -webkit-backdrop-filter: blur(8px);
      display: none;
      justify-content: center;
      align-items: flex-start;
      z-index: 1000;
      opacity: 0;
      transition: opacity 0.3s ease;
      overflow-y: auto;
      padding: 40px 0;
    }

    .edit-modal.active {
      display: flex;
      opacity: 1;
    }

    .edit-modal-content {
      background: rgba(18, 18, 24, 0.95);
      border: 1px solid var(--border-color);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.5);
      border-radius: 8px;
      width: 90%;
      max-width: 600px;
      margin: auto;
      padding: 30px;
      position: relative;
      transform: scale(0.9);
      transition: transform 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275);
    }

    .edit-modal::-webkit-scrollbar,
    .edit-modal-content::-webkit-scrollbar {
      width: 6px;
    }
    .edit-modal::-webkit-scrollbar-track,
    .edit-modal-content::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.01);
    }
    .edit-modal::-webkit-scrollbar-thumb,
    .edit-modal-content::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 3px;
    }
    .edit-modal::-webkit-scrollbar-thumb:hover,
    .edit-modal-content::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .edit-modal.active .edit-modal-content {
      transform: scale(1);
    }

    .edit-modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 15px;
    }

    .edit-modal-title {
      font-family: 'Outfit', sans-serif;
      font-size: 20px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: var(--accent);
    }

    .edit-modal-close {
      cursor: pointer;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 1.5px;
      text-transform: uppercase;
      color: var(--danger);
      transition: opacity 0.2s;
    }

    .edit-modal-close:hover {
      opacity: 0.8;
    }

    .edit-modal-footer {
      display: flex;
      justify-content: flex-end;
      gap: 15px;
      margin-top: 30px;
      border-top: 1px solid var(--border-color);
      padding-top: 20px;
    }

    /* TABS SYSTEM STYLE */
    .admin-tabs {
      display: flex;
      gap: 10px;
      margin-bottom: 30px;
      border-bottom: 1px solid var(--border-color);
      padding-bottom: 12px;
      overflow-x: auto;
      white-space: nowrap;
      -webkit-overflow-scrolling: touch;
      scrollbar-width: thin;
    }

    .admin-tabs::-webkit-scrollbar {
      height: 4px;
    }

    .admin-tabs::-webkit-scrollbar-track {
      background: rgba(255, 255, 255, 0.02);
    }

    .admin-tabs::-webkit-scrollbar-thumb {
      background: rgba(255, 255, 255, 0.15);
      border-radius: 4px;
    }

    .admin-tabs::-webkit-scrollbar-thumb:hover {
      background: var(--accent);
    }

    .tab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 11px 20px;
      font-family: 'Outfit', sans-serif;
      font-size: 12px;
      font-weight: 700;
      letter-spacing: 1.2px;
      text-transform: uppercase;
      cursor: pointer;
      border-radius: 6px;
      transition: all 0.25s ease;
      flex-shrink: 0;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .tab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: var(--text-main);
      border-color: rgba(255, 255, 255, 0.2);
    }

    .tab-btn.active {
      background: var(--accent-muted);
      color: var(--accent);
      border-color: var(--accent);
      box-shadow: 0 0 15px rgba(204, 255, 0, 0.2);
    }

    .tab-content {
      display: none;
      animation: tabFadeIn 0.4s ease forwards;
    }

    .tab-content.active {
      display: block;
    }

    @keyframes tabFadeIn {
      from { opacity: 0; transform: translateY(10px); }
      to { opacity: 1; transform: translateY(0); }
    }

    /* PERIOD TOGGLES & ADVANCED ANALYTICS STYLES */
    .period-filter-group {
      display: inline-flex;
      gap: 6px;
      background: rgba(255, 255, 255, 0.03);
      padding: 4px;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      flex-wrap: wrap;
      align-items: center;
    }

    .period-btn {
      background: transparent;
      border: none;
      color: var(--text-muted);
      padding: 6px 14px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.8px;
      text-transform: uppercase;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .period-btn:hover {
      color: var(--text-main);
      background: rgba(255, 255, 255, 0.05);
    }

    .period-btn.active {
      background: var(--accent);
      color: #000;
      font-weight: 900;
      box-shadow: 0 0 10px rgba(204, 255, 0, 0.3);
    }

    .visitor-subtab-btn {
      background: rgba(255, 255, 255, 0.03);
      border: 1px solid var(--border-color);
      color: var(--text-muted);
      padding: 7px 16px;
      font-family: 'Outfit', sans-serif;
      font-size: 11px;
      font-weight: 700;
      letter-spacing: 0.5px;
      border-radius: 4px;
      cursor: pointer;
      transition: all 0.2s ease;
      display: inline-flex;
      align-items: center;
      gap: 6px;
    }

    .visitor-subtab-btn:hover {
      background: rgba(255, 255, 255, 0.08);
      color: #fff;
      border-color: rgba(255, 255, 255, 0.2);
    }

    .visitor-subtab-btn.active {
      background: rgba(204, 255, 0, 0.12);
      color: var(--accent);
      border-color: var(--accent);
      font-weight: 900;
      box-shadow: 0 0 10px rgba(204, 255, 0, 0.15);
    }

    .analytics-kpi-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
      gap: 16px;
      margin-bottom: 25px;
    }

    .analytics-kpi-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      padding: 20px;
      border-radius: 8px;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      position: relative;
      overflow: hidden;
      transition: all 0.25s ease;
    }

    .analytics-kpi-card:hover {
      border-color: rgba(204, 255, 0, 0.3);
      transform: translateY(-2px);
    }

    .analytics-kpi-card::after {
      content: '';
      position: absolute;
      top: 0;
      left: 0;
      right: 0;
      height: 2px;
      background: linear-gradient(90deg, transparent, var(--accent), transparent);
      opacity: 0.4;
    }

    .analytics-kpi-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 10px;
    }

    .analytics-kpi-label {
      color: var(--text-muted);
      font-size: 10.5px;
      letter-spacing: 1px;
      text-transform: uppercase;
      font-weight: 700;
    }

    .analytics-kpi-value {
      font-family: 'Outfit', sans-serif;
      font-size: 26px;
      font-weight: 700;
      color: #fff;
      margin-bottom: 4px;
    }

    .analytics-kpi-sub {
      font-size: 10.5px;
      color: var(--text-muted);
      display: flex;
      align-items: center;
      gap: 5px;
    }

    .analytics-grid-2 {
      display: grid;
      grid-template-columns: repeat(2, 1fr);
      gap: 20px;
      margin-bottom: 25px;
    }

    .chart-card {
      background: var(--panel-bg);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 22px;
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      display: flex;
      flex-direction: column;
      min-height: 340px;
    }

    .chart-card-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 16px;
      border-bottom: 1px solid rgba(255, 255, 255, 0.05);
      padding-bottom: 10px;
    }

    .chart-card-title {
      font-family: 'Outfit', sans-serif;
      font-size: 13.5px;
      font-weight: 700;
      letter-spacing: 1px;
      text-transform: uppercase;
      color: #fff;
      display: flex;
      align-items: center;
      gap: 8px;
    }

    .chart-card-badge {
      font-size: 9.5px;
      color: var(--text-muted);
      background: rgba(255, 255, 255, 0.04);
      padding: 3px 8px;
      border-radius: 4px;
      border: 1px solid var(--border-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;

    async function fetchSubscribers() {
      const tableBody = document.getElementById("subscribersTableBody");
      const feedCount = document.getElementById("subscribersFeedCount");
      if (!tableBody) return;
      
      try {
          // Self-healing automatic sync of offline subscribers
          const offlineSubs = JSON.parse(localStorage.getItem("minara_offline_subscribers") || "[]");
          if (offlineSubs.length > 0) {
              console.log("Found pending offline subscribers to sync:", offlineSubs.length);
              let syncSuccessCount = 0;
              for (const sub of offlineSubs) {
                  try {
                      await addDoc(collection(db, "subscribers"), {
                          email: sub.email,
                          timestamp: sub.timestamp
                      });
                      syncSuccessCount++;
                  } catch (syncErr) {
                      console.warn("Failed to sync offline subscriber email:", sub.email, syncErr);
                  }
              }
              if (syncSuccessCount > 0) {
                  const remainingSubs = offlineSubs.slice(syncSuccessCount);
                  if (remainingSubs.length === 0) {
                      localStorage.removeItem("minara_offline_subscribers");
                  } else {
                      localStorage.setItem("minara_offline_subscribers", JSON.stringify(remainingSubs));
                  }
                  console.log(`Successfully synced ${syncSuccessCount} offline subscribers to Firestore.`);
              }
          }

          // Fetch live subscribers from Firestore
          const q = query(collection(db, "subscribers"), orderBy("timestamp", "desc"));
          const querySnapshot = await getDocs(q);
          
          let allSubscribers = [];
          querySnapshot.forEach((doc) => {
              const data = doc.data();
              allSubscribers.push({
                  id: doc.id,
                  email: data.email,
                  timestamp: data.timestamp,
                  source: 'firestore'
              });
          });

          // Fetch offline cached subscribers from localStorage
          const currentOfflineSubs = JSON.parse(localStorage.getItem("minara_offline_subscribers") || "[]");
          currentOfflineSubs.forEach((sub, index) => {
              if (!allSubscribers.some(item => item.email.toLowerCase() === sub.email.toLowerCase())) {
                  allSubscribers.push({
                      id: `local_cache_q${index}`,
                      email: sub.email,
                      timestamp: sub.timestamp,
                      source: 'offline'
                  });
              }
          });

          // Sort merged list by timestamp descending
          allSubscribers.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));

          if (allSubscribers.length === 0) {
              tableBody.innerHTML = `
                  <tr>
                      <td colspan="4" style="text-align: center; opacity: 0.5; padding: 30px;">No subscribers registered yet.</td>
                  </tr>
              `;
              if (feedCount) feedCount.textContent = "0 Subscribers";
              return;
          }
          
          tableBody.innerHTML = ""; // Clear existing grid items securely
          allSubscribers.forEach((sub) => {
              const date = new Date(sub.timestamp).toLocaleString();
              const isOffline = sub.source === 'offline';
              const badgeClass = isOffline ? 'pending' : 'admin';
              const badgeText = isOffline ? 'PENDING SYNC' : '5% OFF ACTIVE';
              const emailColor = isOffline ? '#ff9f0a' : 'var(--accent)';
              
              const tr = document.createElement('tr');
              
              // Email cell securely built with textContent
              const emailTd = document.createElement('td');
              emailTd.style.fontWeight = 'bold';
              emailTd.style.color = emailColor;
              emailTd.textContent = sub.email;
              
              if (isOffline) {
                  const offlineSpan = document.createElement('span');
                  offlineSpan.style.cssText = "font-size: 8px; font-weight: normal; color: #ff9f0a; border: 1px solid rgba(255, 159, 10, 0.3); padding: 1px 4px; margin-left: 5px; border-radius: 2px;";
                  offlineSpan.textContent = "OFFLINE CACHE";
                  emailTd.appendChild(offlineSpan);
              }
              tr.appendChild(emailTd);
              
              // Date cell
              const dateTd = document.createElement('td');
              dateTd.textContent = date;
              tr.appendChild(dateTd);
              
              // Badge cell
              const badgeTd = document.createElement('td');
              const badgeSpan = document.createElement('span');
              badgeSpan.className = `status-badge ${badgeClass}`;
              badgeSpan.textContent = badgeText;
              badgeTd.appendChild(badgeSpan);
              tr.appendChild(badgeTd);
              
              // ID cell securely built with textContent
              const idTd = document.createElement('td');
              idTd.style.fontFamily = 'monospace';
              idTd.style.opacity = '0.5';
              idTd.textContent = sub.id;
              tr.appendChild(idTd);
              
              tableBody.appendChild(tr);
          });
          if (feedCount) feedCount.textContent = allSubscribers.length + " Active Subscribers";
      } catch (error) {
          console.error("Error fetching subscribers from Firestore:", error);
          
          const offlineSubs = JSON.parse(localStorage.getItem("minara_offline_subscribers") || "[]");
          let mergedSubscribers = [];
          offlineSubs.forEach((sub, index) => {
              mergedSubscribers.push({
                  id: `local_cache_q${index}`,
                  email: sub.email,
                  timestamp: sub.timestamp,
                  source: 'offline'
              });
          });
          
          mergedSubscribers.sort((a, b) => new Date(b.timestamp) - new Date(a.timestamp));
          
          tableBody.innerHTML = "";
          const errorTr = document.createElement('tr');
          const errorTd = document.createElement('td');
          errorTd.setAttribute('colspan', '4');
          errorTd.style.cssText = "text-align: center; color: var(--danger); font-size: 11px; padding: 12px; background: rgba(255, 59, 48, 0.05); border-bottom: 1px solid rgba(255, 59, 48, 0.2);";
          errorTd.textContent = `⚠ Firestore Connection Error: ${error.message} (Using local cache fallback)`;
          errorTr.appendChild(errorTd);
          tableBody.appendChild(errorTr);
          
          if (mergedSubscribers.length === 0) {
              const emptyTr = document.createElement('tr');
              const emptyTd = document.createElement('td');
              emptyTd.setAttribute('colspan', '4');
              emptyTd.style.cssText = "text-align: center; opacity: 0.5; padding: 30px;";
              emptyTd.textContent = "No offline cached subscribers.";
              emptyTr.appendChild(emptyTd);

      const tableBody = document.querySelector("#catalogTable tbody");

      if (!tableBody) return;
      
      let products = [];
      
      try {
          const localProds = JSON.parse(localStorage.getItem("minara_products") || "[]");
          localProds.forEach(p => {
              const existingIdx = products.findIndex(item => item.id === p.id);
              if (existingIdx > -1) {
                  products[existingIdx] = {
                      ...products[existingIdx],
                      ...p
                  };
              } else {
                  products.push(p);
              }
          });
      } catch (e) {
          console.error("Local storage products load failed:", e);
      }
      
      const renderTable = () => {
          tableBody.innerHTML = "";
          
          // Sort products first using display order
          const sortedProducts = [...products].sort((a, b) => {
              const hasA = a.sortOrder !== undefined && a.sortOrder !== null && a.sortOrder !== "";
              const hasB = b.sortOrder !== undefined && b.sortOrder !== null && b.sortOrder !== "";
              
              if (hasA && !hasB) return -1;
              if (!hasA && hasB) return 1;
              if (hasA && hasB) {
                  const diff = Number(a.sortOrder) - Number(b.sortOrder);
                  if (diff !== 0) return diff;
              }
              
              const nameA = (a.nameShort || a.name || "").toLowerCase();
              const nameB = (b.nameShort || b.name || "").toLowerCase();

              badge.textContent = products.length;
          });
          
          // Helper to render interactive slots
          const renderOrderSlots = (inputEl, helpEl, containerEl, currentProductId = null) => {
              if (!containerEl) return;
              containerEl.innerHTML = "";
              
              const totalSlots = products.length + 1;
              const usedOrders = products
                  .map(p => p.sortOrder)
                  .filter(o => o !== undefined && o !== null && o !== "" && !isNaN(o));
              const uniqueUsed = [...new Set(usedOrders)].sort((a, b) => Number(a) - Number(b));
              const defaultHelpText = uniqueUsed.length > 0 ? "Numbers in use: " + uniqueUsed.join(", ") : "None in use";

              const validateSortOrder = () => {
                  const val = parseInt(inputEl.value);
                  if (isNaN(val) || val <= 0) {
                      helpEl.textContent = defaultHelpText;
                      helpEl.style.color = "var(--text-muted)";
                      return;
                  }
                  const conflict = products.find(p => p.sortOrder === val && p.id !== currentProductId);
                  if (conflict) {
                      helpEl.innerHTML = `⚠️ Slot ${val} is currently taken by <strong>"${conflict.nameShort || conflict.name}"</strong>.`;
                      helpEl.style.color = "var(--danger)";
                  } else {
                      helpEl.innerHTML = `✓ Slot ${val} is free.`;
                      helpEl.style.color = "var(--success)";
                  }
              };

              inputEl.oninput = validateSortOrder;

              // Generate badges
              for (let i = 1; i <= totalSlots; i++) {
                  const badge = document.createElement("span");
                  badge.style.cssText = "display: inline-block; font-size: 10px; padding: 4px 8px; border-radius: 4px; border: 1px solid #ccc; cursor: pointer; transition: all 0.2s; font-family: inherit; font-weight: bold; text-transform: uppercase;";
                  
                  const conflict = products.find(p => p.sortOrder === i && p.id !== currentProductId);
                  if (conflict) {
                      badge.style.backgroundColor = "#eaeaea";
                      badge.style.borderColor = "#eaeaea";
                      badge.style.color = "#888";
                      badge.title = `Taken by "${conflict.nameShort || conflict.name}"`;
                      badge.innerHTML = `${i} <span style="font-size: 8px; opacity: 0.8; font-weight: normal;">(${conflict.nameShort || (conflict.id ? conflict.id.substring(0, 8) : "")})</span>`;
                  } else {
                      badge.style.backgroundColor = "#fff";
                      badge.style.borderColor = "#000";
                      badge.style.color = "#000";
                      badge.innerHTML = `${i} <span style="font-size: 8px; color: var(--success); font-weight: normal;">• Free</span>`;
                  }
                  
                  badge.onclick = () => {
                      inputEl.value = i;
                      validateSortOrder();
                  };
                  
                  containerEl.appendChild(badge);
              }
              
              validateSortOrder();
          };

          window.renderOrderSlots = renderOrderSlots;

          const addSortOrderInput = document.getElementById("prodSortOrder");
          const addHelpEl = document.getElementById("prodSortOrderHelp");
          const addContainerEl = document.getElementById("addOrderSlotsContainer");
          
          if (addSortOrderInput && !addSortOrderInput.value) {
              addSortOrderInput.value = products.length + 1;
          }
          if (addSortOrderInput) {
              addSortOrderInput.max = products.length + 1;
          }
          
          renderOrderSlots(addSortOrderInput, addHelpEl, addContainerEl, null);
          
          const editSortOrderInput = document.getElementById("editProdSortOrder");
          if (editSortOrderInput) {
              editSortOrderInput.max = products.length;
          }
          
          window.minaraProducts = products;
      };

      renderTable();
      
      setTimeout(async () => {
          if (window.db && window.dbCollection && window.dbGetDocs) {
              try {
                  const timeoutPromise = new Promise((_, reject) => 
                      setTimeout(() => reject(new Error("Timeout")), 10000)
                  );
                  const querySnapshot = await Promise.race([
                      window.dbGetDocs(window.dbCollection(window.db, "products")),
                      timeoutPromise
                  ]);
                  
                  let updated = false;
                  let firestoreProds = [];
                  
                  querySnapshot.forEach((doc) => {
                      const data = doc.data();
                      const p = {
                          id: doc.id,
                          nameShort: data.nameShort || "",
                          name: data.name,
                          price: Number(data.price),
                          retailPrice: data.retailPrice !== undefined ? Number(data.retailPrice) : null,
                          stock: Number(data.stock),
                          status: data.status,
                          image: data.image,
                          image_thumb: data.image_thumb || "",
                          description: data.description,
                          flair: data.flair || "",
                          invisibleFlair: data.invisibleFlair || "",
                          standardBottleImg: data.standardBottleImg || "",
                          masculinePremiumBottleImg: data.masculinePremiumBottleImg || "",
                          femininePremiumBottleImg: data.femininePremiumBottleImg || "",
                          customisations: data.customisations || [],
                          sizes: data.sizes || ["50ml", "100ml"],
                          isBundle: !!data.isBundle,
                          bundleSize: Number(data.bundleSize) || 0,
                          sortOrder: data.sortOrder !== undefined && data.sortOrder !== null ? Number(data.sortOrder) : null
                      };
                      firestoreProds.push(p);
                      
                      const existingIdx = products.findIndex(item => item.id === p.id);

    window.compressImage = function(file, maxWidth = 1200, quality = 0.80) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload = function(event) {
          const img = new Image();
          img.onload = function() {
            const canvas = document.createElement('canvas');
            let width = img.width;
            let height = img.height;
            
            if (width > maxWidth) {
              height = Math.round((height * maxWidth) / width);
              width = maxWidth;
            }
            
            canvas.width = width;
            canvas.height = height;
            
            const ctx = canvas.getContext('2d');
            ctx.fillStyle = '#ffffff';
            ctx.fillRect(0, 0, width, height);
            ctx.drawImage(img, 0, 0, width, height);
            
            const dataUrl = canvas.toDataURL('image/webp', quality);
            resolve(dataUrl);
          };
          img.onerror = function(err) { reject(err); };
          img.src = event.target.result;
        };
        reader.onerror = function(err) { reject(err); };
        reader.readAsDataURL(file);
      });
    };
    function compressImage(file, maxWidth, quality) { return window.compressImage(file, maxWidth, quality); }

    window.sanitizeImageUrl = function(url) {
      if (!url || typeof url !== 'string') return "";
      const trimmed = url.trim();
      if (trimmed.startsWith("file:") || trimmed.includes(":\\") || trimmed.includes("antigravity-ide")) {
        const idx = trimmed.indexOf("images/");
        if (idx !== -1) {
          return trimmed.substring(idx);
        }
        return "";
      }
      return trimmed;
    };
    function sanitizeImageUrl(url) { return window.sanitizeImageUrl(url); }

      }
    };

    window.compressUrlOrPath = function(urlOrPath, maxWidth, quality) {
      return new Promise((resolve) => {
        if (!urlOrPath) {
          resolve("");
          return;
        }
        const cleaned = window.sanitizeImageUrl(urlOrPath);
        if (!cleaned || cleaned.startsWith('file:') || cleaned.includes(':\\') || cleaned.includes('antigravity-ide')) {
          console.warn("Security bypass: Ignoring local file path in compressUrlOrPath:", urlOrPath);
          resolve("");
          return;
        }
        if (cleaned.startsWith('data:')) {
          resolve(cleaned);
          return;
        }
        
        try {
          const img = new Image();
          img.crossOrigin = "anonymous";
          img.onload = function() {
            try {
              const canvas = document.createElement('canvas');
              let width = img.width;
              let height = img.height;
              
              if (width > maxWidth) {
                height = Math.round((height * maxWidth) / width);
                width = maxWidth;
              }
              
              canvas.width = width;
              canvas.height = height;
              
              const ctx = canvas.getContext('2d');
              ctx.fillStyle = '#ffffff';
              ctx.fillRect(0, 0, width, height);
              ctx.drawImage(img, 0, 0, width, height);
              
              const dataUrl = canvas.toDataURL('image/webp', quality);
              resolve(dataUrl);
            } catch (canvasErr) {
              console.warn("Canvas conversion failed, resolving original:", canvasErr);
              resolve(cleaned);
            }
          };
          img.onerror = function(err) {
            console.warn("Image load failed in compressUrlOrPath, resolving original:", cleaned);
            resolve(cleaned);
          };
          img.src = cleaned;
        } catch (e) {
          console.warn("Image setup exception in compressUrlOrPath:", e);
          resolve(cleaned);
        }
      });
    };

        reader.onload = function(event) {

        reader.onerror = function(err) {
          reject(err);
        };
        reader.readAsDataURL(file);
      });

    const getFileExtension = function(filename, defaultExt = "webp") {
      if (!filename) return defaultExt;
      const match = filename.match(/\.([a-zA-Z0-9]+)$/);
      if (!match) return defaultExt;
      let ext = match[1].toLowerCase();
      if (ext === "jpeg") ext = "jpg";
      return ext;

    const predictPath = function(file, inputVal, defaultPath) {

        const name = defaultPath.includes("left") ? "left" : (defaultPath.includes("right") ? "right" : "mobile");
        return `${folder}/${name}.${ext}`;
      }
      return inputVal || defaultPath;
    };

      const contentGen = document.getElementById("editTabContentGeneral");

    window.toggleKeyNoteSelection = function(noteName, noteFile) {
      if (!window.currentEditKeyNotes) window.currentEditKeyNotes = [];
      const iconPath = `Perfume Note Icons/${noteFile}`;
      const existingIdx = window.currentEditKeyNotes.findIndex(k => (typeof k === "string" ? k : k.name).toLowerCase() === noteName.toLowerCase());
      
      if (existingIdx > -1) {
        window.currentEditKeyNotes.splice(existingIdx, 1);
      } else {
        window.currentEditKeyNotes.push({

          icon: iconPath

    window.renderNoteLibraryGrid = function(filterText) {
      const grid = document.getElementById("editNoteLibraryGrid");

      grid.innerHTML = "";

      const query = (filterText || "").trim().toLowerCase();
      const filtered = window.PERFUME_NOTE_LIBRARY.filter(n => n.name.toLowerCase().includes(query));

      if (filtered.length === 0) {
        grid.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--text-muted); font-size: 10px; padding: 15px;">No fragrance notes found matching "${filterText}".</div>`;
        return;

      filtered.forEach(note => {
        const isSelected = (window.currentEditKeyNotes || []).some(k => (typeof k === "string" ? k : k.name).toLowerCase() === note.name.toLowerCase());
        const card = document.createElement("div");
        card.style.cssText = `display: flex; flex-direction: column; align-items: center; padding: 6px 4px; background: ${isSelected ? 'rgba(204, 255, 0, 0.15)' : 'rgba(255, 255, 255, 0.03)'}; border: 1px solid ${isSelected ? 'var(--accent)' : 'rgba(255, 255, 255, 0.08)'}; border-radius: 4px; cursor: pointer; text-align: center; transition: all 0.15s ease; user-select: none; position: relative;`;

    window.updateCustomisationBlockLabel = function(idx, val) {
      if (window.currentEditCustomisations && window.currentEditCustomisations[idx]) {
        window.currentEditCustomisations[idx].label = val.trim().toUpperCase();
      }
    };

    window.updateCustomisationBlockSize = function(idx, val) {
      if (window.currentEditCustomisations && window.currentEditCustomisations[idx]) {
        window.currentEditCustomisations[idx].size = (val || '').trim();
      }
    };

    window.updateCustomisationBlockPriceExtra = function(idx, val) {
      if (window.currentEditCustomisations && window.currentEditCustomisations[idx]) {
        window.currentEditCustomisations[idx].priceExtra = parseFloat(val) || 0;
      }
    };

    window.updateCustomisationBlockStock = function(idx, val) {
      if (window.currentEditCustomisations && window.currentEditCustomisations[idx]) {
        const trimmed = (val || '').toString().trim();
        window.currentEditCustomisations[idx].stock = trimmed === "" ? null : (parseInt(trimmed, 10) || 0);
      }
    };

    window.addEditCustomisationBlock = function() {
      if (!window.currentEditCustomisations) window.currentEditCustomisations = [];
      window.currentEditCustomisations.push({
        label: "OPTION " + (window.currentEditCustomisations.length + 1),
        size: "100ml",
        image: "",
        image_thumb: "",
        priceExtra: 0,
        stock: 10
      });
      window.renderEditCustomisationBlocks();
    };

    window.removeEditCustomisationBlock = function(idx) {
      if (window.currentEditCustomisations && idx >= 0 && idx < window.currentEditCustomisations.length) {
        window.currentEditCustomisations.splice(idx, 1);
        window.renderEditCustomisationBlocks();
      }
    };

    window.handleBlockImageUpload = async function(idx, event) {
      const file = event.target.files[0];
      if (!file || !window.currentEditCustomisations || !window.currentEditCustomisations[idx]) return;

      try {
        const mainBase64 = await compressImage(file, 1200, 0.90);
        const thumbBase64 = await compressImage(file, 800, 0.85);

        window.currentEditCustomisations[idx].image = mainBase64;
        window.currentEditCustomisations[idx].image_thumb = thumbBase64;
        window.currentEditCustomisations[idx].image_data = mainBase64;
        window.renderEditCustomisationBlocks();
      } catch (err) {
        console.error("Block image upload compression failed:", err);
        alert("Failed to compress uploaded image: " + err.message);
      }
    };

    window.openEditModal = function(productId) {
      if (!window.minaraProducts) return;
      const product = window.minaraProducts.find(p => p.id === productId);
      if (!product) return;

      const logBox = document.getElementById("adminSaveLogBox");
      if (logBox) {
        logBox.innerHTML = "";
        logBox.style.display = "none";
      }

      document.getElementById("editProdId").value = product.id;
      document.getElementById("editProdNameShort").value = product.nameShort || "";
      document.getElementById("editProdName").value = product.name;
      document.getElementById("editProdPrice").value = product.price;
      document.getElementById("editProdRetailPrice").value = product.retailPrice || "";
      document.getElementById("editProdStock").value = product.stock;
      const editSortOrderInput = document.getElementById("editProdSortOrder");
      editSortOrderInput.value = product.sortOrder !== undefined && product.sortOrder !== null ? product.sortOrder : "";
      const editHelpEl = document.getElementById("editProdSortOrderHelp");
      const editContainerEl = document.getElementById("editOrderSlotsContainer");
      if (typeof window.renderOrderSlots === "function") {
          window.renderOrderSlots(editSortOrderInput, editHelpEl, editContainerEl, product.id);
      }
      document.getElementById("editProdImage").value = sanitizeImageUrl(product.image);
      document.getElementById("editProdDesc").value = product.description;

    window.handleSaveEdit = async function(e) {
      e.preventDefault();
      
      const id = document.getElementById("editProdId").value;
      const nameShort = document.getElementById("editProdNameShort").value.trim();
      const name = document.getElementById("editProdName").value.trim();
      const price = parseFloat(document.getElementById("editProdPrice").value);
      const retailPriceVal = document.getElementById("editProdRetailPrice").value.trim();
      const retailPrice = retailPriceVal !== "" ? parseFloat(retailPriceVal) : null;
      const stock = parseInt(document.getElementById("editProdStock").value);
      const imageInput = sanitizeImageUrl(document.getElementById("editProdImage").value);
      const fileInput = document.getElementById("editProdFile").files[0];
      const description = document.getElementById("editProdDesc").value.trim();
      const status = document.getElementById("editProdStatus").value;
      const flair = document.getElementById("editProdFlair").value;
      const invisibleFlair = document.getElementById("editProdInvisibleFlair").value;
      const standardBottleImg = sanitizeImageUrl(document.getElementById("editProdStandardBottleImg").value);
      const masculinePremiumBottleImg = sanitizeImageUrl(document.getElementById("editProdMasculinePremiumBottleImg").value);
      const femininePremiumBottleImg = sanitizeImageUrl(document.getElementById("editProdFemininePremiumBottleImg").value);
      const isBundle = document.getElementById("editProdIsBundle").checked;
      const bundleSize = isBundle ? parseInt(document.getElementById("editProdBundleSize").value) : 0;
      const sortOrderVal = document.getElementById("editProdSortOrder").value.trim();
      const sortOrder = sortOrderVal !== "" ? parseInt(sortOrderVal) : null;

      // Extract Scent Profile
      const topNotes = document.getElementById("editProdTopNotes") ? document.getElementById("editProdTopNotes").value.trim() : "";
      const topNotesDesc = (document.getElementById("editProdTopNotesDesc") ? document.getElementById("editProdTopNotesDesc").value.trim() : "") || "The first notes you smell";
      const middleNotes = document.getElementById("editProdMiddleNotes") ? document.getElementById("editProdMiddleNotes").value.trim() : "";
      const middleNotesDesc = (document.getElementById("editProdMiddleNotesDesc") ? document.getElementById("editProdMiddleNotesDesc").value.trim() : "") || "The heart of the perfume";
      const baseNotes = document.getElementById("editProdBaseNotes") ? document.getElementById("editProdBaseNotes").value.trim() : "";
      const baseNotesDesc = (document.getElementById("editProdBaseNotesDesc") ? document.getElementById("editProdBaseNotesDesc").value.trim() : "") || "The notes that linger all day";

      const scentProfile = {
        keyNotes: window.currentEditKeyNotes || [],
        topNotes: topNotes,
        topNotesDesc: topNotesDesc,
        middleNotes: middleNotes,
        middleNotesDesc: middleNotesDesc,
        baseNotes: baseNotes,
        baseNotesDesc: baseNotesDesc
      };

      if (!id || !name || isNaN(price) || isNaN(stock)) return;
      if (!imageInput && !fileInput) {
        alert("Please either provide an Image Path/URL or select a file to upload.");
        return;
      }

      const submitBtn = e.target.querySelector('button[type="submit"]');
      const originalText = submitBtn ? submitBtn.innerHTML : "";
      if (submitBtn) {
          submitBtn.disabled = true;
          submitBtn.innerHTML = "SAVING...";
      }

      window.logAdminSave(`Starting edit save process for: "${name}" (${id})`);

      let mainImageBase64 = imageInput;
      let thumbImageBase64 = "";

      if (window.minaraProducts) {
          const existingProd = window.minaraProducts.find(p => p.id === id);
          if (existingProd) {
              thumbImageBase64 = existingProd.image_thumb || "";
              if (imageInput !== existingProd.image) {
                  thumbImageBase64 = "";
              }
          }
      }

      if (fileInput) {
        window.logAdminSave("Compressing main image file upload...");
        try {
          mainImageBase64 = await compressImage(fileInput, 1200, 0.90);
          thumbImageBase64 = await compressImage(fileInput, 800, 0.85);
          window.logAdminSave("File compressed successfully.");
        } catch (compressErr) {
          window.logAdminSave("Image compression error: " + compressErr.message, true);
          mainImageBase64 = imageInput;
        }
      }

      const sizes = [];
      if (document.getElementById("editProdSize50").checked) sizes.push("50ml");
      if (document.getElementById("editProdSize100").checked) sizes.push("100ml");

      const updatedProduct = {
          id: id,
          nameShort: nameShort,
          name: name,
          price: price,
          retailPrice: retailPrice,
          stock: stock,
          image: mainImageBase64,
          image_thumb: thumbImageBase64,
          description: description,
          status: status,
          flair: flair,
          invisibleFlair: invisibleFlair,
          standardBottleImg: standardBottleImg,
          masculinePremiumBottleImg: masculinePremiumBottleImg,
          femininePremiumBottleImg: femininePremiumBottleImg,
          customisations: window.currentEditCustomisations || [],
          sizes: sizes,
          isBundle: isBundle,
          bundleSize: bundleSize,
          sortOrder: sortOrder,
          scentProfile: scentProfile
      };

      if (window.minaraProducts) {
          const mIdx = window.minaraProducts.findIndex(p => p.id === id);
          if (mIdx > -1) {
              window.minaraProducts[mIdx] = updatedProduct;
          } else {
              window.minaraProducts.push(updatedProduct);
          }
          if (typeof renderProductsTable === "function") {
              renderProductsTable();
          }
      }

      try {
          const localProds = JSON.parse(localStorage.getItem("minara_products") || "[]");
          const idx = localProds.findIndex(p => p.id === id);
          updatedProduct.syncStatus = "pending";
          if (idx > -1) {
              localProds[idx] = updatedProduct;
          } else {
              localProds.push(updatedProduct);
          }
          localStorage.setItem("minara_products", JSON.stringify(localProds));
          window.logAdminSave("Saved product snapshot to localStorage cache.");
      } catch (err) {
          window.logAdminSave("LocalStorage error: " + err.message, true);
      }

      let firestoreSuccess = false;
      let firestoreErrorMsg = "";

      if (window.db && window.dbDoc && window.dbSetDoc) {
          window.logAdminSave("Writing product data to Firestore database...");
          try {
              const timeoutPromise = new Promise((_, reject) => 
                  setTimeout(() => reject(new Error("Timeout")), 20000)
              );
              await Promise.race([
                  window.dbSetDoc(window.dbDoc(window.db, "products", id), {
                      nameShort: nameShort,
                      name: name,
                      price: price,
                      retailPrice: retailPrice,
                      stock: stock,
                      image: mainImageBase64,
                      image_thumb: thumbImageBase64,
                      description: description,
                      status: status,
                      flair: flair,
                      invisibleFlair: invisibleFlair,
                      standardBottleImg: standardBottleImg,
                      masculinePremiumBottleImg: masculinePremiumBottleImg,
                      femininePremiumBottleImg: femininePremiumBottleImg,
                      customisations: window.currentEditCustomisations || [],
                      sizes: sizes,
                      isBundle: isBundle,
                      bundleSize: bundleSize,
                      sortOrder: sortOrder,
                      scentProfile: scentProfile,
                      timestamp: new Date().toISOString()
                  }),
                  timeoutPromise
              ]);
              firestoreSuccess = true;
              window.logAdminSave("✓ Firestore write successful.");
              
              try {
                  const localProds = JSON.parse(localStorage.getItem("minara_products") || "[]");
                  const idx = localProds.findIndex(p => p.id === id);
                  if (idx > -1) {
                      localProds[idx].syncStatus = "synced";
                      localStorage.setItem("minara_products", JSON.stringify(localProds));
                  }
              } catch (cacheErr) {}
          } catch (dbErr) {
              firestoreErrorMsg = dbErr.message || dbErr;
              window.logAdminSave("⚠ Firestore write failed: " + firestoreErrorMsg, true);
          }
      }

      // Sync edited product to GitHub static repo
      if (firestoreSuccess && window.syncToGithubCallable) {
          window.logAdminSave("Calling syncToGithubCallable ('saveProduct')...");
          try {
              const res = await window.syncToGithubCallable({
                  action: "saveProduct",
                  payload: {
                      id: id,
                      nameShort: nameShort,
                      name: name,
                      price: price,
                      retailPrice: retailPrice,
                      stock: stock,
                      image: mainImageBase64,
                      image_thumb: thumbImageBase64,
                      description: description,
                      status: status,
                      flair: flair,
                      invisibleFlair: invisibleFlair,
                      standardBottleImg: standardBottleImg,
                      masculinePremiumBottleImg: masculinePremiumBottleImg,
                      femininePremiumBottleImg: femininePremiumBottleImg,
                      customisations: window.currentEditCustomisations || [],
                      sizes: sizes,
                      isBundle: isBundle,
                      bundleSize: bundleSize,
                      sortOrder: sortOrder,
                      scentProfile: scentProfile
                  }
              });
              window.logAdminSave("✓ GitHub sync successful: " + (res.data ? res.data.message : "OK"));
          } catch (gitHubErr) {
              window.logAdminSave("⚠ GitHub sync warning: " + (gitHubErr.message || gitHubErr), true);
              alert("Warning: Product was updated in database, but GitHub sync failed: " + (gitHubErr.message || gitHubErr));
          }
      }

      const editFileEl = document.getElementById("editProdFile");
      if (editFileEl) {
        editFileEl.value = "";
        editFileEl.dispatchEvent(new Event("change", { bubbles: true }));
      }

      closeEditModal();
      if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = originalText;
      }

      if (firestoreSuccess) {
          alert("Success! " + name + " has been successfully updated and synced.");
      } else {
          alert("Warning: " + name + " was updated locally, but failed to sync online.\nError: " + firestoreErrorMsg);
      }
      
      if (typeof window.loadCatalog === 'function') {
          window.loadCatalog();
      }
    };

    window.handleSaveCustomTextSettings = async function(e) {
      if (e) e.preventDefault();
      
      const saveBtn = document.getElementById("saveCustomTextBtn");
      const originalText = saveBtn ? saveBtn.innerHTML : "";
      if (saveBtn) {
        saveBtn.disabled = true;
        saveBtn.innerHTML = "PUBLISHING...";
      }

      const payload = {
        features: [],
        trust_banner: [],
        accordions: {
          wearingOccasion: document.getElementById("accordionWearing").value,
          honestComparisonInspired: document.getElementById("accordionHonestInspired").value,
          honestComparisonNonInspired: document.getElementById("accordionHonestNonInspired").value,
          ingredients: document.getElementById("accordionIngredients").value,
          shippingReturns: document.getElementById("accordionShippingReturns").value
        }
      };

      for (let i = 0; i < 6; i++) {
        payload.features.push({
          title: document.getElementById(`featureTitle${i}`).value,
          description: document.getElementById(`featureDesc${i}`).value
        });
      }

      for (let i = 0; i < 2; i++) {
        payload.trust_banner.push({
          title: document.getElementById(`trustTitle${i}`).value,
          description: document.getElementById(`trustDesc${i}`).value
        });
      }

      try {
        localStorage.setItem("minara_custom_text", JSON.stringify(payload));

        let dbSaved = false;
        if (window.db && window.dbDoc && window.dbSetDoc) {
          try {
            await window.dbSetDoc(window.dbDoc(window.db, "settings", "custom_text"), payload);
            dbSaved = true;
          } catch (dbErr) {
            console.error("Firestore custom text settings save failed:", dbErr);
          }
        }

        let gitHubSynced = false;
        if (window.syncToGithubCallable) {
          try {
            const response = await window.syncToGithubCallable({
              action: "saveCustomText",
              payload: payload
            });
            if (response.data && response.data.success) {
              gitHubSynced = true;
            } else {
              throw new Error(response.data ? response.data.message : "GitHub sync failed");
            }
          } catch (gitHubErr) {
            console.error("Failed to sync custom text to GitHub:", gitHubErr);
            throw gitHubErr;
          }
        }

        if (dbSaved && gitHubSynced) {
          alert("Success! Text & Footer settings published and synchronized to GitHub.");
        } else if (dbSaved) {
          alert("Warning: Text settings saved to database, but GitHub sync failed.");
        } else {
          alert("Warning: Local changes saved, but database and GitHub updates failed.");
        }

      } catch (err) {

    window.saveImageNames = async function() {
      const inputs = document.querySelectorAll("#imageOptimizerTableBody input");
      const renameList = [];

      inputs.forEach(input => {
        const idx = parseInt(input.dataset.index);
        const originalFilename = input.dataset.original;
        const ext = input.dataset.ext;
        const newBaseName = input.value.trim().toLowerCase().replace(/[^a-z0-9-_]+/g, "-");
        const newFilename = newBaseName + ext;

        if (newFilename !== originalFilename) {
          const img = activeImages[idx];
          const pathParts = img.src.split("/");
          const folderPath = pathParts.slice(0, -1).join("/");

          renameList.push({
            oldPath: img.src,
            newPath: `${folderPath}/${newFilename}`,
            inputEl: input,
            statusSpan: document.getElementById(`img-status-${idx}`)
          });
        }
      });

      if (renameList.length === 0) {
        alert("No filename changes detected.");
        return;
      }

      const saveBtn = document.getElementById("saveImageNamesBtn");
      const originalText = saveBtn.innerHTML;
      saveBtn.disabled = true;
      saveBtn.innerHTML = "SAVING...";

      if (window.syncToGithubCallable) {
        try {
          const payload = renameList.map(r => ({ oldPath: r.oldPath, newPath: r.newPath }));

          renameList.forEach(r => {
            r.statusSpan.className = "status-badge pending";
            r.statusSpan.textContent = "RENAME PENDING";
          });

          const response = await window.syncToGithubCallable({
            action: "renameImages",
            payload: payload
          });

          if (response.data && response.data.success) {
            renameList.forEach(r => {
              r.statusSpan.className = "status-badge shipped";
              r.statusSpan.textContent = "RENAMED ✓";
              const newFilenameOnly = r.newPath.split("/").pop();
              r.inputEl.dataset.original = newFilenameOnly;
            });
            alert("Success! Image files renamed and JSON configurations updated.");
            loadImageList();
          } else {
            throw new Error(response.data ? response.data.message : "Rename failed");
          }
        } catch (err) {
          console.error("Failed to rename images via GitHub sync:", err);
          renameList.forEach(r => {
            r.statusSpan.className = "status-badge error";
            r.statusSpan.style.background = "rgba(255, 59, 48, 0.15)";
            r.statusSpan.style.color = "var(--danger)";
            r.statusSpan.style.border = "1px solid rgba(255, 59, 48, 0.25)";
            r.statusSpan.textContent = "FAILED";
          });
          alert("Error renaming images: " + (err.message || err));
        }
      } else {
        alert("Firebase GitHub sync function is not initialized.");
      }

      saveBtn.disabled = false;
      saveBtn.innerHTML = originalText;
    };

      document.getElementById("editReviewAuthor").value = review.name || "";
      document.getElementById("editReviewRating").value = review.rating || 5;
      
      let dateVal = "";
      if (review.timestamp) {
        try {
          const d = new Date(review.timestamp);
          const offset = d.getTimezoneOffset() * 60000;
          const localISOTime = (new Date(d.getTime() - offset)).toISOString().slice(0, 16);
          dateVal = localISOTime;
        } catch (e) {
          console.warn("Invalid date format for review", review.timestamp);
        }
      }
      document.getElementById("editReviewDate").value = dateVal;
      document.getElementById("editReviewContent").value = review.text || "";

      const modal = document.getElementById("editReviewModal");
      modal.classList.add("active");
    };

    window.closeEditReviewModal = function() {
      const modal = document.getElementById("editReviewModal");
      modal.classList.remove("active");
    };

    window.handleSaveReviewEdit = async function(e) {
      e.preventDefault();
      
      const reviewId = document.getElementById("editReviewId").value;
      const name = document.getElementById("editReviewAuthor").value.trim();
      const rating = Number(document.getElementById("editReviewRating").value);
      const dateStr = document.getElementById("editReviewDate").value;
      const text = document.getElementById("editReviewContent").value.trim();

      if (!reviewId || !name || !text || isNaN(rating)) return;

      const submitBtn = e.target.querySelector('button[type="submit"]');
      if (submitBtn) {
        submitBtn.disabled = true;
        submitBtn.innerHTML = "SAVING...";
      }

      try {
        if (!window.db || !window.dbDoc || !window.dbUpdateDoc) {
          throw new Error("Firestore SDK not loaded.");
        }

        const timestamp = new Date(dateStr).toISOString();

        const reviewDocRef = window.dbDoc(window.db, "reviews", reviewId);
        await window.dbUpdateDoc(reviewDocRef, {
          name: name,
          rating: rating,
          timestamp: timestamp,
          text: text
        });

        alert("Review updated successfully!");
        window.closeEditReviewModal();
        window.loadAdminReviews();
      } catch (err) {
        console.error("Error updating review:", err);
        alert("Failed to update review: " + err.message);
      } finally {
        if (submitBtn) {
          submitBtn.disabled = false;
          submitBtn.innerHTML = "Save Review";
        }
      }
    };

    window.syncReviewsToGit = async function() {
      if (adminReviews.length === 0) {
        alert("No reviews to sync. Please refresh from database first.");
        return;
      }

      const syncBtn = document.getElementById("syncReviewsBtn");
      const originalText = syncBtn.innerHTML;
      syncBtn.disabled = true;
      syncBtn.innerHTML = "SYNCING TO GIT...";

      try {
        if (!window.syncToGithubCallable) {
          throw new Error("GitHub sync function not initialized.");
        }

        // Clean reviews list to save to json (only keep necessary fields)
        const cleanedReviews = adminReviews.map(r => ({
          productId: r.productId,
          name: r.name,
          text: r.text,
          rating: Number(r.rating),
          timestamp: r.timestamp
        }));

        const response = await window.syncToGithubCallable({
          action: "syncReviews",
          payload: cleanedReviews
        });

        if (response.data && response.data.success) {
          alert("Success! Reviews synchronized to GitHub.");
        } else {
          throw new Error(response.data ? response.data.message : "Sync failed");
        }
      } catch (err) {
        console.error("Failed to sync reviews to GitHub:", err);
        alert("Error syncing reviews to Git: " + (err.message || err));
      } finally {
        syncBtn.disabled = false;
        syncBtn.innerHTML = originalText;
      }
    };

    let adminOrders = [];
    let activeOrderFilter = "all";
    let orderSearchQuery = "";
    let ordersViewMode = "cards"; // 'cards' | 'table'
    let selectedOrderForModal = null;
    let minaraCatalogProducts = [];

    // Preload products.json for instant perfume thumbnail matching
    async function loadProductsCatalogForOrders() {
      try {
        const res = await fetch("products.json");
        if (res.ok) {
          minaraCatalogProducts = await res.json();
        }
      } catch (e) {
        console.warn("Could not preload products.json for order icons", e);
      }
    }
    loadProductsCatalogForOrders();

    // Helper: Find product thumbnail from order item or catalog
    function getProductImageForItem(item) {
      if (item.image_thumb && typeof item.image_thumb === 'string' && item.image_thumb.trim()) {
        return item.image_thumb.trim();
      }
      if (item.image && typeof item.image === 'string' && item.image.trim()) {
        const splitted = item.image.split(',')[0].trim();
        if (splitted) return splitted;
      }
      // Look up in catalog
      const nameToMatch = (item.name || item.nameShort || item.id || '').toLowerCase().trim();
      const found = minaraCatalogProducts.find(p => 
        (p.name && p.name.toLowerCase().trim() === nameToMatch) ||
        (p.nameShort && p.nameShort.toLowerCase().trim() === nameToMatch) ||
        (p.id && p.id.toLowerCase().trim() === nameToMatch)
      );
      if (found) {
        return found.image_thumb || (found.image ? found.image.split(',')[0].trim() : '') || 'Studio Extrait Icon Svg only logo.svg';
      }
      return 'Studio Extrait Icon Svg only logo.svg';
    }

    // Helper: Packing checklist state
    function isItemPacked(orderId, itemIdx) {
      return localStorage.getItem(`packed_${orderId}_${itemIdx}`) === 'true';
    }
    window.toggleItemPacked = function(orderId, itemIdx, event) {
      if (event) event.stopPropagation();
      const current = isItemPacked(orderId, itemIdx);
      localStorage.setItem(`packed_${orderId}_${itemIdx}`, (!current).toString());
      renderOrdersView();
      if (selectedOrderForModal && (selectedOrderForModal.id === orderId || selectedOrderForModal.orderId === orderId)) {
        renderOrderDetailModalContent(selectedOrderForModal);
      }
    };

    // Helper: 1-Click Copy with toast notification
    window.copyOrderField = function(text, label, event) {
      if (event) event.stopPropagation();
      if (!text) return;
      if (navigator.clipboard) {
        navigator.clipboard.writeText(text).then(() => {
          showCopyToast(`📋 ${label} copied!`);
        }).catch(() => {
          prompt(`Copy ${label}:`, text);
        });
      } else {
        prompt(`Copy ${label}:`, text);
      }
    };

    function showCopyToast(msg) {
      const existing = document.getElementById("orderCopyToast");
      if (existing) existing.remove();

      const toast = document.createElement("div");
      toast.id = "orderCopyToast";
      toast.style.cssText = "position: fixed; bottom: 30px; right: 30px; background: var(--accent); color: #000; font-weight: 900; font-family: 'Outfit', sans-serif; font-size: 12px; padding: 10px 20px; border-radius: 6px; z-index: 99999; box-shadow: 0 8px 24px rgba(0,0,0,0.5); animation: fadeIn 0.2s ease;";
      toast.textContent = msg;
      document.body.appendChild(toast);
      setTimeout(() => {
        if (toast) toast.remove();

    window.setOrdersViewMode = function(mode) {

      const btnTable = document.getElementById("viewBtn_table");
      const cardsContainer = document.getElementById("ordersCardsContainer");
      const tableWrapper = document.getElementById("ordersTableWrapper");

      if (btnCards) btnCards.classList.toggle("active", mode === "cards");
      if (btnTable) btnTable.classList.toggle("active", mode === "table");

    window.filterOrders = function(statusFilter) {

    // Load Orders from Firestore
    window.loadAdminOrders = async function() {
      const cardsContainer = document.getElementById("ordersCardsContainer");
      const tableBody = document.getElementById("ordersTableBody");

      if (cardsContainer) {
        cardsContainer.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; opacity: 0.5; padding: 60px;"><span style="font-size: 32px; display: block; margin-bottom: 10px;">📦</span>Fetching encrypted orders from Cloud Firestore...</div>`;
      }
      if (tableBody) {
        tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; opacity: 0.5; padding: 40px;">Fetching encrypted orders...</td></tr>`;
      }

      try {
        if (!window.db) {
          throw new Error("Firestore DB not initialized");
        }

        const querySnapshot = await window.dbGetDocs(window.dbCollection(window.db, "orders"));
        adminOrders = [];
        querySnapshot.forEach(docSnap => {
          adminOrders.push({ id: docSnap.id, ...docSnap.data() });
        });

        // Sort by createdAt / timestamp descending
        adminOrders.sort((a, b) => {
          const timeA = a.createdAt || a.timestamp ? new Date(a.createdAt || a.timestamp).getTime() : 0;
          const timeB = b.createdAt || b.timestamp ? new Date(b.createdAt || b.timestamp).getTime() : 0;
          return timeB - timeA;
        });

        // Update active orders count in hero stat card
        const ordersCountEl = document.getElementById("dashboardOrdersCount");
        if (ordersCountEl) {
          const paidCount = adminOrders.filter(o => o.paid || o.status === "paid" || o.status === "Pending Shipment").length;
          ordersCountEl.textContent = paidCount.toString();
        }

        renderOrdersView();

      } catch (err) {
        console.error("Failed to load orders from Firestore:", err);
        if (cardsContainer) {
          cardsContainer.innerHTML = `<div style="grid-column: 1 / -1; text-align: center; color: var(--danger); padding: 40px;">Error loading orders: ${err.message}</div>`;
        }
      }
    };

    // Unified Render Dispatcher
    function renderOrdersView() {
      // 1. Calculate Filter Chip Counts
      const totalAll = adminOrders.length;
      const totalPaid = adminOrders.filter(o => o.paid || o.status === "paid" || o.status === "Pending Shipment").length;
      const totalPending = adminOrders.filter(o => !o.paid && o.status !== "paid" && o.status !== "Shipped" && o.status !== "Delivered").length;
      const totalShipped = adminOrders.filter(o => o.status === "Shipped").length;
      const totalDelivered = adminOrders.filter(o => o.status === "Delivered").length;

      const cAll = document.getElementById("countOrders_all");
      const cPaid = document.getElementById("countOrders_paid");
      const cPend = document.getElementById("countOrders_pending");
      const cShip = document.getElementById("countOrders_shipped");
      const cDelv = document.getElementById("countOrders_delivered");

      if (cAll) cAll.textContent = totalAll;
      if (cPaid) cPaid.textContent = totalPaid;
      if (cPend) cPend.textContent = totalPending;
      if (cShip) cShip.textContent = totalShipped;
      if (cDelv) cDelv.textContent = totalDelivered;

      // 2. Filter Orders
      let filtered = adminOrders;
      if (activeOrderFilter === "paid") {
        filtered = adminOrders.filter(o => o.paid || o.status === "paid" || o.status === "Pending Shipment");
      } else if (activeOrderFilter === "pending_payment") {
        filtered = adminOrders.filter(o => !o.paid && o.status !== "paid" && o.status !== "Shipped" && o.status !== "Delivered");
      } else if (activeOrderFilter === "shipped") {
        filtered = adminOrders.filter(o => o.status === "Shipped");
      } else if (activeOrderFilter === "delivered") {
        filtered = adminOrders.filter(o => o.status === "Delivered");
      }

      // 3. Search Query Filter
      if (orderSearchQuery) {
        filtered = filtered.filter(o => {
          const ref = (o.orderId || o.id || "").toLowerCase();
          const name = (o.customerName || `${o.firstName || ''} ${o.lastName || ''}`).toLowerCase();
          const email = (o.email || "").toLowerCase();
          const phone = (o.phone || "").toLowerCase();
          const waybill = (o.waybill || "").toLowerCase();
          const addr = (o.address || "").toLowerCase();
          const itemsStr = o.items && Array.isArray(o.items) ? o.items.map(i => `${i.name} ${i.nameShort}`).join(" ").toLowerCase() : "";

          return ref.includes(orderSearchQuery) ||
                 name.includes(orderSearchQuery) ||
                 email.includes(orderSearchQuery) ||
                 phone.includes(orderSearchQuery) ||
                 waybill.includes(orderSearchQuery) ||
                 addr.includes(orderSearchQuery) ||
                 itemsStr.includes(orderSearchQuery);
        });
      }

      // 4. Render Active View
      renderOrderCards(filtered);
      renderOrdersTable(filtered);
    }

        tableBody.innerHTML = `<tr><td colspan="7" style="text-align: center; opacity: 0.4; padding: 50px;">No orders found for this filter.</td></tr>`;

      tableBody.innerHTML = "";

        tr.style.borderBottom = "1px solid rgba(255, 255, 255, 0.06)";
        tr.style.cursor = "pointer";
